version: '3.8'

services:
  vuln-web:
    build: .
    container_name: rift-vuln-test-lab
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
    volumes:
      - ./app.py:/app/app.py
    networks:
      - rift-test

networks:
  rift-test:
    driver: bridge
